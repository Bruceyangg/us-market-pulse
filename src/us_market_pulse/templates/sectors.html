{% extends "base.html" %}
{% block title %}Pulse Desk · 热点板块{% endblock %}
{% block status_default %}同步板块行情与情报…{% endblock %}
{% block content %}
      <section class="page-intro sectors-intro">
        <div class="sectors-intro-main">
          <p class="page-kicker">板块台</p>
          <h1>AI 与热点板块</h1>
          <p class="lede compact" id="hot-sectors-blurb">按涨跌排序 · 同屏看利空、走势与产业链</p>
        </div>
        <div class="cta-row sectors-intro-actions">
          <button class="btn primary btn-compact" id="btn-sectors-refresh" type="button">刷新</button>
          <div class="tf-filters" id="sector-tf-filters" role="tablist" aria-label="个股走势周期">
            <button type="button" class="filter is-active" data-stf="intraday" aria-selected="true">分时</button>
            <button type="button" class="filter" data-stf="day" aria-selected="false">日图</button>
            <button type="button" class="filter" data-stf="month" aria-selected="false">月图</button>
          </div>
        </div>
      </section>

      <div class="sectors-board" id="sectors-board">
        <div class="sector-etf-strip" id="sector-etf-grid" aria-label="热点板块">
          <div class="index-card skeleton"></div>
          <div class="index-card skeleton"></div>
          <div class="index-card skeleton"></div>
        </div>

        <div class="sectors-workspace">
          <aside class="sectors-rail sectors-rail-left" aria-label="AI 利空与强势个股">
            <section class="sectors-panel" id="ai-desk">
              <div class="sectors-panel-head">
                <h2>AI 利空</h2>
                <p id="ai-desk-blurb">算力与大模型风险</p>
              </div>
              <article class="war-analysis-card compact" id="ai-analysis-card">
                <div class="live-brief-skeleton">汇总中…</div>
              </article>
              <div class="spotlight-list compact" id="ai-news-list"></div>
            </section>

            <section class="sectors-panel" id="sector-picks">
              <div class="sectors-panel-head">
                <h2>强势个股</h2>
                <p id="sector-picks-blurb">相对板块更强</p>
              </div>
              <div class="holding-list sector-pick-list" id="sector-pick-list" role="listbox" aria-label="强势个股列表">
                <p class="empty">加载中…</p>
              </div>
            </section>
          </aside>

          <section class="sectors-center" aria-label="个股走势">
            <div class="portfolio-chart sector-chart" id="sector-pick-chart">
              <p class="chart-placeholder">选择个股后显示走势</p>
            </div>
          </section>

          <aside class="sectors-rail sectors-rail-right" aria-label="产业链与板块消息">
            <section class="sectors-panel value-chain" id="value-chain">
              <div class="sectors-panel-head">
                <h2>业务与产业链</h2>
                <p id="value-chain-blurb">主营 / 上下游</p>
              </div>
              <div class="value-chain-body" id="value-chain-body">
                <p class="empty">选择个股后显示</p>
              </div>
            </section>

            <section class="sectors-panel" id="sector-news-mini">
              <div class="sectors-panel-head">
                <h2>板块消息</h2>
              </div>
              <div class="spotlight-list compact" id="sector-news-list">
                <p class="empty">加载中…</p>
              </div>
            </section>
          </aside>
        </div>
      </div>
{% endblock %}
