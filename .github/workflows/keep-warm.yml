name: Keep Render warm

# Render's FREE web service spins down after ~15 min of no inbound traffic; the
# next visitor then eats a ~30-60s cold start. This scheduled job pings the cheap
# /healthz endpoint every ~10 min so the instance stays awake (public repo → free
# Actions minutes). NOTE: GitHub cron is best-effort (can be delayed under load and
# is auto-disabled after 60 days of repo inactivity) — for rock-solid keep-warm also
# add an external pinger (cron-job.org / UptimeRobot) hitting the same URL.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz (retry until awake)
        run: |
          URL="https://us-market-pulse-6sqa.onrender.com/healthz"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i → HTTP $code : $(cat /tmp/body)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "healthz did not return 200 after retries" >&2
          exit 1
