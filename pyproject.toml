[project]
name = "us-market-pulse"
version = "0.1.0"
description = "Pulse Desk — US market, Fed, Treasury, and policy intelligence desk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[project.scripts]
us-market-pulse = "us_market_pulse:main"
pulse-push = "us_market_pulse.push:main"
pulse-share = "us_market_pulse.share:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
